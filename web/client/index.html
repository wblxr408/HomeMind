<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeMind — 智能家居中央指令器</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f4f0;
            --bg-tertiary: #eeece7;
            --text-primary: #1a1a18;
            --text-secondary: #5a5a56;
            --text-tertiary: #9a9994;
            --border-light: rgba(0, 0, 0, 0.10);
            --border-mid: rgba(0, 0, 0, 0.15);
            --accent: #1D9E75;
            --accent-light: #5DCAA5;
            --accent-bg: #E1F5EE;
            --bubble-user: #2C2C2A;
            --bubble-user-text: #F1EFE8;
            --radius-md: 8px;
            --radius-lg: 12px;
            --panel-width: 220px;
            --progress-height: 2px;
            --progress-label-size: 9px;
            --shadow: 0 4px 32px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background: var(--bg-tertiary);
            background-image:
                radial-gradient(circle at top, rgba(29, 158, 117, 0.10), transparent 26%),
                linear-gradient(180deg, #f3f1eb 0%, #ebe7e0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-primary);
        }

        .app {
            display: flex;
            flex-direction: column;
            width: 900px;
            height: 680px;
            background: var(--bg-tertiary);
            border-radius: 20px;
            overflow: hidden;
            border: 0.5px solid var(--border-light);
            box-shadow: var(--shadow);
            position: relative;
        }

        .topbar {
            background: var(--bg-primary);
            border-bottom: 0.5px solid var(--border-light);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            object-fit: contain;
            flex-shrink: 0;
            display: block;
        }

        .brand-copy {
            min-width: 0;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .brand-sub {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 1px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
            box-shadow: 0 0 0 6px rgba(29, 158, 117, 0.10);
            animation: pulse 2s infinite;
        }

        .clock {
            font-size: 12px;
            color: var(--text-tertiary);
            font-variant-numeric: tabular-nums;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .progress-wrap {
            flex-shrink: 0;
            background: var(--bg-primary);
            border-bottom: 0.5px solid var(--border-light);
            padding: 5px 18px 6px;
        }

        .progress-labels {
            display: flex;
            margin-bottom: 4px;
        }

        .progress-label {
            flex: 1;
            font-size: var(--progress-label-size);
            color: var(--text-tertiary);
            text-align: center;
            line-height: 1.2;
        }

        .progress-label.done { color: var(--text-secondary); }
        .progress-label.active { color: #0F6E56; }
        .progress-label.error { color: #b44b3a; }

        .progress-track {
            height: var(--progress-height);
            display: flex;
            gap: 2px;
            border-radius: 1px;
            overflow: hidden;
        }

        .progress-step {
            flex: 1;
            background: var(--border-light);
            border-radius: 1px;
        }

        .progress-step.done { background: var(--accent); }
        .progress-step.active { background: var(--accent-light); }
        .progress-step.error { background: #d97f6c; }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .chat-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(245,244,240,0.7) 100%);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            display: flex;
            flex-direction: column;
            max-width: 66%;
        }

        .msg.user {
            align-self: flex-end;
            align-items: flex-end;
            display: inline-flex;
            width: max-content;
            max-width: 66%;
        }
        .msg.ai, .msg.system { align-self: flex-start; align-items: flex-start; }

        .bubble {
            padding: 9px 13px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg.user .bubble {
            background: var(--bubble-user);
            color: var(--bubble-user-text);
            border-bottom-right-radius: 4px;
            display: inline-block;
        }

        .msg.ai .bubble,
        .msg.system .bubble {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 0.5px solid var(--border-light);
        }

        .msg-time {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 3px;
            padding: 0 2px;
        }

        .action-tag {
            display: inline-block;
            margin-top: 6px;
            font-size: 11px;
            color: #0F6E56;
            background: var(--accent-bg);
            padding: 2px 7px;
            border-radius: 4px;
        }

        .voice-feedback {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .voice-feedback button {
            border: 0.5px solid var(--border-light);
            background: var(--bg-primary);
            color: var(--text-secondary);
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 11px;
            cursor: pointer;
        }

        .voice-feedback button:hover {
            color: #0F6E56;
            border-color: rgba(29, 158, 117, 0.35);
        }

        .inline-correction {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 6px;
            margin-top: 8px;
            align-items: center;
        }

        .inline-correction input {
            min-width: 0;
            height: 30px;
            border: 0.5px solid var(--border-light);
            border-radius: 6px;
            padding: 0 8px;
            font-size: 12px;
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
        }

        .inline-correction input:focus {
            border-color: rgba(29, 158, 117, 0.45);
            box-shadow: 0 0 0 2px rgba(29, 158, 117, 0.10);
        }

        .inline-correction button {
            border-radius: 6px;
            padding: 5px 9px;
        }

        .chat-input-wrap {
            border-top: 0.5px solid var(--border-light);
            padding: 10px 12px;
            background: var(--bg-primary);
            display: flex;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            min-height: 40px;
            max-height: 120px;
            border: 0.5px solid var(--border-light);
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 13px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            outline: none;
            resize: none;
            line-height: 1.45;
            font-family: inherit;
            overflow-y: auto;
        }

        .chat-input:focus {
            border-color: var(--border-mid);
        }

        .send-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--bubble-user);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-btn svg { fill: var(--bubble-user-text); }

        .mic-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 0.5px solid var(--border-light);
            background: var(--bg-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mic-btn svg { width: 14px; height: 14px; fill: var(--text-secondary); }
        .mic-btn.listening { background: #b44b3a; border-color: #b44b3a; }
        .mic-btn.listening svg { fill: #ffffff; }

        .panel {
            width: var(--panel-width);
            flex-shrink: 0;
            border-left: 0.5px solid var(--border-light);
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel-section {
            padding: 12px;
        }

        .panel-section + .panel-section {
            border-top: 0.5px solid var(--border-light);
        }

        .section-label {
            font-size: 10px;
            color: var(--text-tertiary);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .sensor-row {
            display: flex;
            gap: 6px;
        }

        .sensor-card {
            flex: 1;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: 8px 6px;
            text-align: center;
            border: 0.5px solid rgba(29, 158, 117, 0.08);
        }

        .sensor-label {
            font-size: 9px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .sensor-val {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }

        .sensor-unit {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .entry-card {
            width: 100%;
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            background: var(--bg-secondary);
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
            margin-top: 8px;
        }

        .entry-card:first-of-type { margin-top: 0; }
        .entry-card:hover { background: var(--bg-tertiary); }

        .entry-card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .entry-card-sub {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .entry-card-arrow {
            font-size: 14px;
            color: var(--text-tertiary);
        }

        .log-area {
            background: var(--bg-secondary);
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 8px;
            font-size: 11px;
            color: var(--text-tertiary);
            font-family: "SF Mono", Menlo, Consolas, monospace;
            line-height: 1.7;
            max-height: 160px;
            overflow-y: auto;
        }

        .log-line {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.38);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .overlay.open { display: flex; }

        .modal {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            border: 0.5px solid var(--border-light);
            width: 400px;
            max-height: 480px;
            overflow-y: auto;
            padding: 16px;
        }

        .modal.wide {
            width: 640px;
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            cursor: pointer;
            font-size: 16px;
            color: var(--text-secondary);
            background: none;
            border: none;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rule-card,
        .info-card,
        .summary-card {
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-md);
            background: var(--bg-secondary);
            padding: 10px 12px;
        }

        .rule-head,
        .summary-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .rule-name,
        .summary-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .rule-meta,
        .summary-meta,
        .info-text {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-top: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .mini-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .mini-btn {
            border: 0.5px solid var(--border-light);
            border-radius: 999px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-size: 11px;
            padding: 5px 10px;
            cursor: pointer;
        }

        .mini-btn:hover {
            border-color: rgba(29, 158, 117, 0.35);
            color: #0F6E56;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 10px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            border: 0.5px solid var(--border-light);
            white-space: nowrap;
        }

        .pill.on {
            background: var(--accent-bg);
            color: #0F6E56;
            border-color: rgba(29, 158, 117, 0.25);
        }

        .kv-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .kv-item {
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            padding: 8px 10px;
        }

        .kv-label {
            font-size: 10px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .kv-value {
            font-size: 12px;
            color: var(--text-primary);
            margin-top: 4px;
            line-height: 1.45;
            word-break: break-word;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            font-size: 10px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .field input,
        .field select,
        .field textarea {
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 12px;
            padding: 8px 10px;
            outline: none;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: var(--border-mid);
        }

        .floorplan-preview {
            position: relative;
            min-height: 220px;
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }

        .floorplan-preview img {
            width: 100%;
            height: auto;
            display: block;
        }

        .device-marker {
            position: absolute;
            transform: translate(-50%, -50%);
            min-width: 18px;
            height: 18px;
            border-radius: 999px;
            padding: 0 5px;
            background: #0F6E56;
            color: #fff;
            font-size: 10px;
            line-height: 18px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            white-space: nowrap;
        }

        .device-marker-label {
            position: absolute;
            transform: translate(-50%, 8px);
            background: rgba(255, 255, 255, 0.92);
            border: 0.5px solid var(--border-light);
            border-radius: 999px;
            padding: 2px 6px;
            color: var(--text-primary);
            font-size: 10px;
            white-space: nowrap;
        }

        .empty-hint {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .scene-card {
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            background: var(--bg-primary);
        }

        .scene-card:hover { background: var(--bg-secondary); }
        .scene-card.active { border-color: var(--accent); background: var(--accent-bg); }

        .scene-card-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .scene-card-desc {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .device-card {
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--bg-primary);
        }

        .device-area-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .device-area-chip {
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px 10px;
            text-align: left;
            min-height: 52px;
        }

        .device-area-chip:hover {
            border-color: rgba(29, 158, 117, 0.35);
            color: #0F6E56;
        }

        .device-area-chip.active {
            border-color: rgba(29, 158, 117, 0.45);
            background: var(--accent-bg);
            color: #0F6E56;
        }

        .device-area-name {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .device-area-count {
            display: block;
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 3px;
        }

        .compact-device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .device-card.compact {
            align-items: stretch;
            flex-direction: column;
            justify-content: flex-start;
            padding: 8px;
            gap: 6px;
        }

        .device-card.compact .device-actions {
            justify-content: space-between;
            width: 100%;
        }

        .device-card.compact .device-inline-form {
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            margin-top: 6px;
        }

        .device-card.compact .mini-btn {
            padding: 4px 8px;
            font-size: 10px;
        }

        .device-edit-toggle summary {
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 10px;
            margin-top: 4px;
            list-style: none;
        }

        .device-edit-toggle summary::-webkit-details-marker {
            display: none;
        }

        .device-main {
            min-width: 0;
            flex: 1;
        }

        .device-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .device-inline-form {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 120px 110px 110px;
            gap: 6px;
            margin-top: 8px;
        }

        .device-inline-form input,
        .device-inline-form select {
            min-width: 0;
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-md);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 11px;
            padding: 6px 8px;
            outline: none;
        }

        .device-name {
            font-size: 12px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .device-status {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .device-id {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 2px;
            word-break: break-word;
        }

        .device-meta {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .scene-action-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .scene-action-row {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) 110px 110px 90px auto;
            gap: 6px;
            align-items: center;
        }

        .scene-action-row select,
        .scene-action-row input {
            min-width: 0;
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 11px;
            padding: 7px 8px;
            outline: none;
        }

        .advanced-json {
            margin-top: 10px;
        }

        .toggle {
            width: 32px;
            height: 18px;
            border-radius: 9px;
            background: var(--border-light);
            position: relative;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .toggle.on { background: var(--accent); }

        .toggle::after {
            content: "";
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            top: 2px;
            left: 2px;
            transition: left 0.2s;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
        }

        .toggle.on::after { left: 16px; }

        .toast {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%) translateY(80px);
            padding: 10px 16px;
            background: rgba(44, 44, 42, 0.96);
            color: var(--bubble-user-text);
            font-size: 11px;
            border-radius: 999px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 20;
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 980px) {
            body { padding: 0; }
            .app {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }

        @media (max-width: 760px) {
            .main { flex-direction: column; }
            .msg { max-width: 84%; }
            .msg.user { max-width: 84%; }
            .panel {
                width: 100%;
                border-left: none;
                border-top: 0.5px solid var(--border-light);
                max-height: 240px;
            }
            .card-grid { grid-template-columns: 1fr; }
            .device-area-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .compact-device-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

                        <div class="msg-time" id="boot-time">--:--:--</div>

                <div class="chat-input-wrap">

                    <button class="mic-btn" id="mic-btn" onclick="toggleVoiceInput()" title="语音输入">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

        <div class="overlay" id="overlay" onclick="closeModal(event)">

                </div>
                <div id="modalBody"></div>
            </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        let scenes = [
            { id: "sleep", name: "睡眠模式", desc: "关闭灯光、调节温度、安防布控" },
            { id: "entertainment", name: "观影模式", desc: "调暗灯光、启动电视、音响就绪" },
            { id: "work", name: "工作模式", desc: "明亮环境、关闭娱乐设备" },
            { id: "away", name: "离家模式", desc: "全关设备、安防启动" },
            { id: "morning", name: "早安模式", desc: "窗帘打开、轻柔音乐、温度适宜" },
            { id: "evening", name: "晚归模式", desc: "门廊亮起、室温预调、氛围灯光" }
        ];

        let deviceList = [
            { id: "air_conditioner", name: "空调" },
            { id: "light", name: "灯光" },
            { id: "tv", name: "电视" },
            { id: "water_heater", name: "热水器" },
            { id: "fan", name: "风扇" },
            { id: "speaker", name: "音响" },
            { id: "window", name: "窗户" }
        ];

        const deviceTypes = [
            { value: "switch", label: "开关" },
            { value: "light", label: "灯光" },
            { value: "climate", label: "空调" },
            { value: "fan", label: "风扇" },
            { value: "media_player", label: "媒体" },
            { value: "speaker", label: "音响" },
            { value: "water_heater", label: "热水器" },
            { value: "cover", label: "窗户/窗帘" }
        ];

        const areaOptions = [
            { value: "", label: "未指定" },
            { value: "living_room", label: "客厅" },
            { value: "bedroom", label: "主卧" },
            { value: "bedroom2", label: "次卧" },
            { value: "study", label: "书房" },
            { value: "kitchen", label: "厨房" },
            { value: "bathroom1", label: "主卫" },
            { value: "bathroom2", label: "次卫" },
            { value: "dining_room", label: "餐厅" },
            { value: "balcony", label: "阳台" },
            { value: "entrance", label: "玄关" }
        ];

        const sceneActionOptions = [
            { value: "on", label: "打开" },
            { value: "off", label: "关闭" },
            { value: "adjust", label: "调节" },
            { value: "open", label: "打开窗/窗帘" },
            { value: "close", label: "关闭窗/窗帘" }
        ];

        const progressOrder = ["bsr", "lsr", "llm", "exec"];
        let socket = null;
        let devices = {};
        let currentScene = "sleep";
        let activePipeline = null;
        let recognition = null;
        let isListening = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let lastVoiceResult = null;
        let toastTimer = null;
        let currentModal = null;
        let rulesCache = [];
        let memorySnapshot = null;
        let privacySnapshot = null;
        let schedulerSnapshot = null;
        let floorPlanUploads = [];
        let selectedFloorPlan = null;
        let floorPlanDevices = [];
        let selectedDeviceArea = "";

        async function apiGet(url) {
            const response = await fetch(url);
            return response.json();
        }

        async function apiJson(url, method = "POST", body = {}) {
            const response = await fetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            return response.json();
        }

        function pad(n) { return String(n).padStart(2, "0"); }

        function getTime() {
            const d = new Date();
            return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
        }

        function tick() {
            document.getElementById("clock").textContent = getTime();
        }

        function autoResize() {
            const box = document.getElementById("inputBox");
            box.style.height = "40px";
            box.style.height = Math.min(box.scrollHeight, 120) + "px";
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\n/g, "<br>");
        }

        function escapeAttr(text) {
            return escapeHtml(text).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function renderDeviceTypeOptions(selectedType) {
            return deviceTypes.map((type) => {
                const selected = type.value === selectedType ? "selected" : "";
                return `<option value="${escapeAttr(type.value)}" ${selected}>${type.label}</option>`;
            }).join("");
        }

        function renderAreaOptions(selectedArea) {
            return areaOptions.map((area) => {
                const selected = area.value === selectedArea ? "selected" : "";
                return `<option value="${escapeAttr(area.value)}" ${selected}>${area.label}</option>`;
            }).join("");
        }

        function areaLabel(area, areaName = "") {
            if (areaName) return areaName;
            const match = areaOptions.find((item) => item.value === area);
            return match ? match.label : (area || "未指定");
        }

        function deviceAreaKey(device = {}) {
            return device.area || "__unassigned__";
        }

        function deviceAreaLabel(areaKey, devicesInArea = []) {
            if (areaKey === "__unassigned__") return areaLabel("");
            const sample = devicesInArea.find((device) => device.areaName) || {};
            return areaLabel(areaKey, sample.areaName || "");
        }

        function groupDevicesByArea() {
            const areaRank = new Map(areaOptions.map((area, index) => [area.value || "__unassigned__", index]));
            const groups = new Map();
            deviceList.forEach((device) => {
                const key = deviceAreaKey(device);
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(device);
            });
            return Array.from(groups.entries())
                .map(([area, devicesInArea]) => ({
                    area,
                    name: deviceAreaLabel(area, devicesInArea),
                    devices: devicesInArea.slice().sort((a, b) => String(a.name).localeCompare(String(b.name), "zh-Hans-CN"))
                }))
                .sort((a, b) => {
                    const rankA = areaRank.has(a.area) ? areaRank.get(a.area) : 999;
                    const rankB = areaRank.has(b.area) ? areaRank.get(b.area) : 999;
                    if (rankA !== rankB) return rankA - rankB;
                    return String(a.name).localeCompare(String(b.name), "zh-Hans-CN");
                });
        }

        function renderCompactDeviceCard(device) {
            const state = devices[device.id] || {};
            return `
                <div class="device-card compact">
                    <div class="device-main">
                        <div class="device-name">${escapeHtml(device.name)}</div>
                        <div class="device-status">${buildDeviceStatus(device.id, state)}</div>
                        <div class="device-meta">${escapeHtml(device.protocol || "simulated")} · ${escapeHtml(areaLabel(device.area || "", device.areaName || ""))}</div>
                        <div class="device-id">${escapeHtml(device.id)}</div>
                        <details class="device-edit-toggle">
                            <summary>编辑设备</summary>
                            <div class="device-inline-form">
                                <input data-device-name="${escapeAttr(device.id)}" value="${escapeAttr(device.name)}">
                                <select data-device-type="${escapeAttr(device.id)}">${renderDeviceTypeOptions(device.type || "switch")}</select>
                                <select data-device-area="${escapeAttr(device.id)}">${renderAreaOptions(device.area || "")}</select>
                                <input data-device-area-name="${escapeAttr(device.id)}" value="${escapeAttr(device.areaName || "")}" placeholder="空间名">
                            </div>
                        </details>
                    </div>
                    <div class="device-actions">
                        <button class="toggle ${state.is_on ? "on" : ""}" data-device-id="${escapeAttr(device.id)}" title="切换设备"></button>
                        <button class="mini-btn" data-device-save="${escapeAttr(device.id)}">保存</button>
                        <button class="mini-btn" data-device-delete="${escapeAttr(device.id)}">删除</button>
                    </div>
                </div>
            `;
        }

        function deviceSceneLabel(device) {
            const room = areaLabel(device.area || "", device.areaName || "");
            return device.area || device.areaName ? `${room} · ${device.name}` : device.name;
        }

        function renderSceneDeviceOptions(selectedDevice = "") {
            return deviceList.map((device) => {
                const selected = device.name === selectedDevice ? "selected" : "";
                return `<option value="${escapeAttr(device.name)}" ${selected}>${escapeHtml(deviceSceneLabel(device))}</option>`;
            }).join("");
        }

        function renderSceneActionOptions(selectedAction = "off") {
            return sceneActionOptions.map((action) => {
                const selected = action.value === selectedAction ? "selected" : "";
                return `<option value="${escapeAttr(action.value)}" ${selected}>${action.label}</option>`;
            }).join("");
        }

        function renderSceneActionRow(action = {}) {
            return `
                <div class="scene-action-row">
                    <select data-scene-action-device>${renderSceneDeviceOptions(action.device || "")}</select>
                    <select data-scene-action-type>${renderSceneActionOptions(action.action || "off")}</select>
                    <select data-scene-param-key>
                        <option value="">无参数</option>
                        <option value="brightness" ${action.paramKey === "brightness" ? "selected" : ""}>亮度</option>
                        <option value="temperature" ${action.paramKey === "temperature" ? "selected" : ""}>温度</option>
                        <option value="volume" ${action.paramKey === "volume" ? "selected" : ""}>音量</option>
                    </select>
                    <input data-scene-param-value type="number" placeholder="数值" value="${escapeAttr(action.paramValue || "")}">
                    <button class="mini-btn" type="button" data-remove-scene-action>删除</button>
                </div>
            `;
        }

        function sceneConfigToActions(config = {}) {
            return Object.entries(config || {}).map(([device, command]) => {
                const params = command && command.params ? command.params : {};
                const paramKey = Object.keys(params)[0] || "";
                return {
                    device,
                    action: command && command.action ? command.action : "off",
                    paramKey,
                    paramValue: paramKey ? params[paramKey] : ""
                };
            });
        }

        function addSceneActionRow(action = {}) {
            const list = document.getElementById("new-scene-actions");
            if (!list) return;
            list.insertAdjacentHTML("beforeend", renderSceneActionRow(action));
            wireSceneActionRemoveButtons();
        }

        function setSceneActionRowsFromConfig(config = {}) {
            const list = document.getElementById("new-scene-actions");
            if (!list) return;
            list.innerHTML = "";
            const actions = sceneConfigToActions(config);
            if (!actions.length) {
                addSceneActionRow({ action: "off" });
                return;
            }
            actions.forEach((action) => addSceneActionRow(action));
        }

        function wireSceneActionRemoveButtons() {
            document.querySelectorAll("[data-remove-scene-action]").forEach((btn) => {
                btn.onclick = () => {
                    const row = btn.closest(".scene-action-row");
                    if (row) row.remove();
                };
            });
        }

        function buildSceneConfigFromRows() {
            const rows = Array.from(document.querySelectorAll("#new-scene-actions .scene-action-row"));
            const config = {};
            rows.forEach((row) => {
                const device = row.querySelector("[data-scene-action-device]")?.value || "";
                const action = row.querySelector("[data-scene-action-type]")?.value || "off";
                const paramKey = row.querySelector("[data-scene-param-key]")?.value || "";
                const paramValueRaw = row.querySelector("[data-scene-param-value]")?.value || "";
                if (!device) return;
                const params = {};
                if (paramKey && paramValueRaw !== "") {
                    const numberValue = Number(paramValueRaw);
                    params[paramKey] = Number.isFinite(numberValue) ? numberValue : paramValueRaw;
                }
                config[device] = { action, params };
            });
            return config;
        }

        function sceneConfigText(config) {
            try {
                return JSON.stringify(config || {}, null, 2);
            } catch (e) {
                return "{}";
            }
        }

        function sceneSummary(config) {
            const entries = Object.entries(config || {});
            if (!entries.length) return "暂无动作";
            return entries.map(([device, command]) => {
                const action = command && command.action ? command.action : "-";
                return `${device} ${action}`;
            }).join(" · ");
        }

        function buildFeedbackButtons(options = {}) {
            const target = options.feedbackTarget || {};
            const correctionPrompt = escapeHtml(options.correctionPrompt || "请输入你期望的正确理解");
            if (!target.message_id || !target.target_type) return "";
            const allowAccept = options.allowAccept !== false;
            const buttons = [];
            if (allowAccept) {
                buttons.push(`<button onclick="sendInteractionFeedback('${target.message_id}', '${target.target_type}', 'accept')">Accept</button>`);
            }
            buttons.push(`<button onclick="sendInteractionFeedback('${target.message_id}', '${target.target_type}', 'change', '${correctionPrompt}')">Change</button>`);
            buttons.push(`<button onclick="sendInteractionFeedback('${target.message_id}', '${target.target_type}', 'reject')">Reject</button>`);
            return `<div class="voice-feedback">${buttons.join("")}</div>`;
        }

        function buildFeedbackButtonsInline(options = {}) {
            const target = options.feedbackTarget || {};
            if (!target.message_id || !target.target_type) return "";
            const messageId = escapeAttr(target.message_id || "");
            const targetType = escapeAttr(target.target_type || "");
            const correctionPrompt = escapeAttr(options.correctionPrompt || "\u8bf7\u8f93\u5165\u4f60\u671f\u671b\u7684\u6b63\u786e\u7406\u89e3");
            const allowAccept = options.allowAccept !== false;
            const buttons = [];
            if (allowAccept) {
                buttons.push(`<button onclick="sendInteractionFeedback('${messageId}', '${targetType}', 'accept')">Accept</button>`);
            }
            buttons.push(`<button onclick="openInlineCorrection(this, '${messageId}', '${targetType}', '${correctionPrompt}')">Change</button>`);
            buttons.push(`<button onclick="sendInteractionFeedback('${messageId}', '${targetType}', 'reject')">Reject</button>`);
            return `<div class="voice-feedback">${buttons.join("")}</div>`;
        }

        buildFeedbackButtons = buildFeedbackButtonsInline;

        function addMsg(role, html, tag, options = {}) {
            const el = document.createElement("div");
            el.className = "msg " + role;
            const tagHtml = tag ? `<span class="action-tag">${tag}</span>` : "";
            const feedbackHtml = buildFeedbackButtons(options);
            el.innerHTML = `<div class="bubble">${escapeHtml(html)}${tagHtml}${feedbackHtml}</div><div class="msg-time">${getTime()}</div>`;
            const msgs = document.getElementById("messages");
            msgs.appendChild(el);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function addVoiceFeedbackMsg(data) {
            lastVoiceResult = data;
            const el = document.createElement("div");
            el.className = "msg system";
            const asrText = escapeHtml(data.text || "");
            const normalized = escapeHtml(data.normalized || data.text || "");
            el.innerHTML = `<div class="bubble">语音识别：${asrText}<br>归一化：${normalized}<div class="voice-feedback"><button onclick="sendVoiceFeedback('accepted')">正确</button><button onclick="sendVoiceFeedback('corrected')">纠正</button><button onclick="sendVoiceFeedback('ignored')">忽略</button></div></div><div class="msg-time">${getTime()}</div>`;
            const msgs = document.getElementById("messages");
            msgs.appendChild(el);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function addLog(subject, status) {
            const log = document.getElementById("log");
            const line = document.createElement("div");
            line.className = "log-line";
            line.textContent = `${getTime()}  ${subject} → ${status}`;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("visible");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove("visible"), 2800);
        }

        function resetProgress() {
            progressOrder.forEach((step) => setProgressState(step, "wait"));
        }

        function setProgressState(step, state) {
            const label = document.querySelector(`.progress-label[data-step="${step}"]`);
            const bar = document.querySelector(`.progress-step[data-step="${step}"]`);
            [label, bar].forEach((el) => {
                if (!el) return;
                el.classList.remove("done", "active", "error");
                if (state !== "wait") {
                    el.classList.add(state);
                }
            });
        }

        function buildDeviceStatus(deviceId, state) {
            if (!state || !state.is_on) {
                return "关闭";
            }
            if (deviceId === "air_conditioner" && state.temperature !== undefined) {
                return `${state.temperature}°C`;
            }
            if (deviceId === "light" && state.brightness !== undefined) {
                return `亮度 ${state.brightness}%`;
            }
            return "开启";
        }

        function getDeviceName(id) {
            const match = deviceList.find((item) => item.id === id);
            return match ? match.name : id;
        }

        function getSceneName(id) {
            const match = scenes.find((item) => item.id === id || item.name === id);
            return match ? match.name : id;
        }

        function isSceneActive(scene) {
            return currentScene === scene.id || currentScene === scene.name;
        }

        function updateContext(ctx) {
            document.getElementById("current-temp").textContent = ctx.temperature ?? "--";
            document.getElementById("current-humidity").textContent = ctx.humidity ?? "--";
            document.getElementById("current-occupancy").textContent = ctx.occupancy ?? "--";
            if (ctx.scene) {
                currentScene = ctx.scene;
            }
            if (currentModal) {
                renderModal(currentModal);
            }
        }

        function updateDeviceState(id, state) {
            devices[id] = state || {};
            if (currentModal === "device") {
                renderModal("device");
            }
        }

        function updateDevices(states) {
            Object.entries(states || {}).forEach(([id, state]) => updateDeviceState(id, state));
        }

        async function loadDevices(rerender = true) {
            try {
                const data = await apiGet("/api/devices");
                if (data.status !== "success") {
                    showToast(data.error || "设备加载失败");
                    return;
                }
                deviceList = (data.devices || []).map((device) => ({
                    id: device.id,
                    name: device.name,
                    type: device.type || "switch",
                    area: device.area || "",
                    areaName: device.areaName || "",
                    protocol: device.protocol || "simulated"
                }));
                (data.devices || []).forEach((device) => {
                    devices[device.id] = device.state || {};
                });
                if (rerender && (currentModal === "device" || currentModal === "scene")) renderModal(currentModal);
            } catch (e) {
                showToast("设备加载失败");
            }
        }

                type: document.getElementById("new-device-type").value,
                area: document.getElementById("new-device-area").value,
                areaName: document.getElementById("new-device-area-name").value.trim(),
                protocol: "simulated"
            };

                showToast("请输入设备名称");

            const input = typeof inputRef === "string" ? document.getElementById(inputRef) : inputRef;
            if (!input) throw new Error("scene config input not found");
            const raw = input.value.trim();
            if (!raw) return {};
            return JSON.parse(raw);
        }

            try {
                const config = buildSceneConfigFromRows();

                const advancedRaw = advanced ? advanced.value.trim() : "";
                const finalConfig = Object.keys(config).length ? config : (advancedRaw ? parseSceneConfigInput("new-scene-config") : {});
                if (!Object.keys(finalConfig).length) {
                    showToast("请至少添加一个场景动作");
                    return;

                const data = await apiJson("/api/scenes", "POST", { name, config: finalConfig });
                if (data.status !== "success") {
                    showToast(data.error || "场景保存失败");

        async function sendQuery(query) {
            if (socket && socket.connected) {
                socket.emit("user_input", { text: query });
                return;
            }

            const data = await apiJson("/api/query", "POST", { query });
            if (data.status === "success") {
                const text = data.response || data.message || "已处理您的指令";
                addMsg("ai", text, "执行完成");
                addLog("系统", text);
                loadStatus();
                return;
            }
            if (data.status === "unsupported") {
                const text = data.response || data.message || "当前暂不支持这个指令";
                addMsg("ai", text, "暂不支持");
                addLog("系统", text);
                return;
            }
            if (data.status === "clarification") {
                const text = data.question || "我需要更多信息";
                addMsg("ai", text, "需要澄清");
                addLog("系统", text);
                return;
            }

            const text = data.message || data.question || "我需要更多信息";
            addMsg("ai", text, "系统响应");
            addLog("系统", text);
        }

        async function submitQuery() {
            const box = document.getElementById("inputBox");
            const val = box.value.trim();
            if (!val) return;
            addMsg("user", val);
            addLog("用户", val);
            box.value = "";
            autoResize();
            try {
                await sendQuery(val);
            } catch (e) {
                showToast("发送失败");
                addMsg("ai", "抱歉，当前没有收到系统回复。", "发送失败");
            }
        }

        function handleKey(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                submitQuery();
            } else {
                setTimeout(autoResize, 0);
            }
        }

        function formatRuleTrigger(trigger = {}) {
            if (trigger.type === "time") return `时间 ${trigger.at || "--:--"}`;
            if (trigger.type === "temperature") return `温度 ${trigger.op || ">"} ${trigger.value ?? "-"}`;
            if (trigger.type === "occupancy") return `人数 ${trigger.op || ">"} ${trigger.value ?? "-"}`;
            if (trigger.type === "scene") return `场景 = ${trigger.equals || "-"}`;
            return "未配置";
        }

        function formatRuleAction(action = {}) {
            if (action.type === "scene_switch") return `切换到 ${action.scene || "-"}`;
            if (action.type === "device_control") return `${action.device || "-"} ${action.device_action || "-"}`;
            return action.type || "未配置";
        }

        function formatLastAction(action = {}) {
            if (!action || !Object.keys(action).length) return "暂无";
            if (action.scene) return `${action.type || "场景切换"} · ${action.scene}`;
            if (action.device) return `${action.type || "设备控制"} · ${action.device} ${action.device_action || ""}`.trim();
            return action.type || "暂无";
        }

        function formatPreferences(prefs = {}) {
            const devicesPref = prefs.devices || {};
            const scenesPref = prefs.scenes || {};
            const parts = [];
            if (devicesPref["空调"]?.preferred_temperature !== undefined) {
                parts.push(`空调偏好 ${devicesPref["空调"].preferred_temperature}°C`);
            }
            if (devicesPref["灯光"]?.preferred_brightness !== undefined) {
                parts.push(`灯光偏好亮度 ${devicesPref["灯光"].preferred_brightness}%`);
            }
            const favoriteScene = Object.entries(scenesPref).sort((a, b) => (b[1].accept_count || 0) - (a[1].accept_count || 0))[0];
            if (favoriteScene) {
                parts.push(`常用场景 ${favoriteScene[0]}`);
            }
            return parts.length ? parts.join("；") : "暂无稳定偏好。";
        }

        function formatJson(value) {
            try {
                return JSON.stringify(value || {}, null, 2);
            } catch (e) {
                return "{}";
            }
        }

        async function createRuleFromForm() {
            const triggerType = document.getElementById("rule-trigger-type").value;
            const triggerValue = document.getElementById("rule-trigger-value").value.trim();
            const actionType = document.getElementById("rule-action-type").value;
            const actionTarget = document.getElementById("rule-action-target").value.trim();
            const paramValue = document.getElementById("rule-param-value").value.trim();
            const rule = {
                name: document.getElementById("rule-name").value.trim() || "未命名规则",
                enabled: true,
                priority: Number(document.getElementById("rule-priority").value || 10),
                trigger: buildTrigger(triggerType, triggerValue),
                conditions: [],
                action: buildRuleAction(actionType, actionTarget, document.getElementById("rule-device-action").value, paramValue)
            };
            try {
                const data = await apiJson("/api/rules", "POST", rule);
                if (data.status !== "success") {
                    showToast(data.error || "规则创建失败");
                    return;
                }
                showToast("规则已保存");
                await loadRules();
            } catch (e) {
                showToast("规则创建失败");
            }
        }

        function buildTrigger(type, rawValue) {
            if (type === "time") return { type: "time", at: rawValue || "22:30" };
            if (type === "temperature") return { type: "temperature", op: ">", value: Number(rawValue || 30) };
            if (type === "occupancy") return { type: "occupancy", op: ">", value: Number(rawValue || 0) };
            return { type: "time", at: "22:30" };
        }

        function buildRuleAction(type, target, deviceAction, paramValue) {
            if (type === "scene_switch") {
                return { type: "scene_switch", scene: target || "睡眠模式" };
            }
            const action = {
                type: "device_control",
                device: target || "空调",
                device_action: deviceAction || "on",
                params: {}
            };
            if (paramValue) {
                const value = Number(paramValue);
                if ((target || "").includes("灯")) action.params.brightness = value;
                else action.params.temperature = value;
            }
            return action;
        }

                    return;
                }
                showToast("规则已删除");
                await loadRules();
            } catch (e) {
                showToast("规则删除失败");
            }
        }

        async function runSingleRule(ruleId) {
            const rule = (rulesCache || []).find((item) => item.id === ruleId);
            if (!rule) return;
            const payload = {
                execute: true,
                context: {
                    temperature: Number(document.getElementById("current-temp").textContent || 25),
                    humidity: Number(document.getElementById("current-humidity").textContent || 60),
                    members_home: Number(document.getElementById("current-occupancy").textContent || 1),
                    current_scene: currentScene
                }
            };
            if (rule.trigger?.type === "time") {
                payload.time = rule.trigger.at || "22:30";
            }
            try {
                const data = await apiJson("/api/rules/evaluate", "POST", payload);
                if (data.status !== "success") {
                    showToast(data.error || "规则评估失败");
                    return;
                }
                const hit = (data.matches || []).find((item) => item.rule?.id === ruleId);
                if (!hit) {
                    showToast("当前上下文下未命中该规则");
                    return;
                }
                if (hit.execution?.status === "success") {
                    showToast("规则已执行");
                    loadStatus();
                } else {
                    showToast(hit.execution?.status || "规则命中但未执行");
                }
            } catch (e) {
                showToast("规则评估失败");
            }
        }

        async function initVoiceRecognition() {
            if (!navigator.mediaDevices || !window.MediaRecorder) {
                showToast("当前浏览器不支持录音上传");
            }
        }

        async function toggleVoiceInput() {
            if (!navigator.mediaDevices || !window.MediaRecorder) {
                showToast("当前浏览器不支持录音上传");
                return;
            }
            if (isListening) {
                mediaRecorder.stop();
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                mediaRecorder.onstop = async () => {
                    isListening = false;
                    document.getElementById("mic-btn").classList.remove("listening");
                    stream.getTracks().forEach((track) => track.stop());
                    await uploadVoiceRecording();
                };
                mediaRecorder.start();
                isListening = true;
                document.getElementById("mic-btn").classList.add("listening");
                showToast("正在录音，再点一次结束");
            } catch (e) {
                showToast("无法访问麦克风");
            }
        }

        async function uploadVoiceRecording() {
            if (!audioChunks.length) {
                showToast("没有录到声音");
                return;
            }
            const mimeType = mediaRecorder && mediaRecorder.mimeType ? mediaRecorder.mimeType : "audio/webm";
            const blob = new Blob(audioChunks, { type: mimeType });
            const form = new FormData();
            form.append("audio", blob, mimeType.includes("wav") ? "voice.wav" : "voice.webm");
            form.append("lang", "auto");
            showToast("正在本地识别语音");
            try {
                const response = await fetch("/api/voice/transcribe", {
                    method: "POST",
                    body: form
                });
                const data = await response.json();
                if (!response.ok || data.status !== "success") {
                    showToast(data.hint || data.error || "语音识别失败");
                    return;
                }
                const text = data.normalized || data.text || "";
                if (!text) {
                    showToast("没有识别到有效指令");
                    return;
                }
                document.getElementById("inputBox").value = text;
                autoResize();
                addLog("语音", data.text || text);
                addVoiceFeedbackMsg(data);
                submitQuery();
            } catch (e) {
                showToast("语音上传失败");
            }
        }

        async function sendVoiceFeedback(feedback) {
            if (!lastVoiceResult) {
                showToast("没有可反馈的语音记录");
                return;
            }
            let correctedText = "";
            let correctedNormalized = "";
            if (feedback === "corrected") {
                correctedText = window.prompt("请输入正确的识别文本或标准指令", lastVoiceResult.normalized || lastVoiceResult.text || "") || "";
                correctedText = correctedText.trim();
                if (!correctedText) {
                    showToast("已取消纠正");
                    return;
                }
            }
            try {
                const response = await fetch("/api/voice/feedback", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        asr_text: lastVoiceResult.text || "",
                        normalized: lastVoiceResult.normalized || "",
                        corrected_text: correctedText,
                        corrected_normalized: correctedNormalized,
                        language: lastVoiceResult.language || "unknown",
                        confidence: lastVoiceResult.confidence || 0,
                        engine: lastVoiceResult.engine || "vosk",
                        feedback
                    })
                });
                const data = await response.json();
                if (!response.ok || data.status !== "success") {
                    showToast(data.error || "反馈记录失败");
                    return;
                }
                showToast("语音反馈已记入历史");
            } catch (e) {
                showToast("反馈提交失败");
            }
        }

        async function sendInteractionFeedback(messageId, targetType, feedbackType, correctionPrompt = "") {
            let correction = "";
            if (feedbackType === "change") {
                correction = window.prompt(correctionPrompt || "请输入纠正后的理解", "") || "";
                correction = correction.trim();
                if (!correction) {
                    showToast("已取消纠正");
                    return;
                }
            }
            try {
                const data = await apiJson("/api/interaction/feedback", "POST", {
                    message_id: messageId,
                    target_type: targetType,
                    feedback_type: feedbackType,
                    correction
                });
                if (data.status !== "success") {
                    showToast(data.error || "反馈提交失败");
                    return;
                }
                if (data.response_type === "automation_proposal" && data.proposal) {
                    addMsg("ai", data.message || data.proposal.summary, "待确认任务", {
                        feedbackTarget: { message_id: data.proposal.message_id, target_type: "automation_proposal" },
                        correctionPrompt: "请输入修正后的定时任务描述",
                    });
                } else if (data.response_type === "automation_created") {
                    addMsg("ai", data.response || "已创建定时任务", "任务已创建");
                }
                showToast(data.message || "反馈已记录");
                loadMemorySummary();
                loadPrivacyStatus();
            } catch (e) {
                showToast("反馈提交失败");
            }
        }

        function openInlineCorrection(button, messageId, targetType, correctionPrompt = "") {
            const container = button.closest(".voice-feedback");
            if (!container) return;
            container.querySelector(".inline-correction")?.remove();
            const form = document.createElement("div");
            form.className = "inline-correction";
            form.innerHTML = `
                <input type="text" placeholder="${escapeAttr(correctionPrompt || "\u8bf7\u8f93\u5165\u7ea0\u6b63\u540e\u7684\u7406\u89e3")}" aria-label="\u7ea0\u6b63\u540e\u7684\u7406\u89e3">
                <button type="button">\u63d0\u4ea4</button>
                <button type="button">\u53d6\u6d88</button>
            `;
            const input = form.querySelector("input");
            const submit = form.querySelectorAll("button")[0];
            const cancel = form.querySelectorAll("button")[1];
            submit.addEventListener("click", () => submitInlineCorrection(form, messageId, targetType));
            cancel.addEventListener("click", () => form.remove());
            input.addEventListener("keydown", (event) => {
                if (event.key === "Enter") submitInlineCorrection(form, messageId, targetType);
                if (event.key === "Escape") form.remove();
            });
            container.appendChild(form);
            input.focus();
            document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
        }

        function submitInlineCorrection(form, messageId, targetType) {
            const input = form.querySelector("input");
            const correction = (input?.value || "").trim();
            if (!correction) {
                showToast("\u8bf7\u8f93\u5165\u4fee\u6539\u5185\u5bb9");
                input?.focus();
                return;
            }
            sendInteractionFeedback(messageId, targetType, "change", correction);
            form.remove();
        }

        async function sendInteractionFeedbackInline(messageId, targetType, feedbackType, correctionValue = "") {
            const correction = feedbackType === "change" ? String(correctionValue || "").trim() : "";
            if (feedbackType === "change" && !correction) {
                showToast("\u8bf7\u8f93\u5165\u4fee\u6539\u5185\u5bb9");
                return;
            }
            try {
                const data = await apiJson("/api/interaction/feedback", "POST", {
                    message_id: messageId,
                    target_type: targetType,
                    feedback_type: feedbackType,
                    correction
                });
                if (data.status !== "success") {
                    showToast(data.error || "\u53cd\u9988\u63d0\u4ea4\u5931\u8d25");
                    return;
                }
                if (feedbackType === "change") {
                    addMsg("user", correction);
                    addLog("\u7528\u6237", correction);
                }
                if (data.response_type === "automation_proposal" && data.proposal) {
                    addMsg("ai", data.message || data.proposal.summary, "\u5f85\u786e\u8ba4\u4efb\u52a1", {
                        feedbackTarget: { message_id: data.proposal.message_id, target_type: "automation_proposal" },
                        correctionPrompt: "\u8bf7\u8f93\u5165\u4fee\u6b63\u540e\u7684\u5b9a\u65f6\u4efb\u52a1\u63cf\u8ff0",
                    });
                } else if (data.response_type === "automation_created") {
                    addMsg("ai", data.response || "\u5df2\u521b\u5efa\u5b9a\u65f6\u4efb\u52a1", "\u4efb\u52a1\u5df2\u521b\u5efa");
                } else if (data.response_type === "execution_result") {
                    renderAgentMessage(data, "\u6267\u884c\u5b8c\u6210");
                } else if (feedbackType === "change") {
                    addMsg("ai", data.message || "\u4fee\u6539\u53cd\u9988\u5df2\u8bb0\u5f55\uff0c\u4f60\u53ef\u4ee5\u7ee7\u7eed\u8f93\u5165\u6216\u518d\u6b21\u4fee\u6539\u3002", "\u53cd\u9988\u5df2\u8bb0\u5f55");
                    addLog("\u7cfb\u7edf", data.message || "\u4fee\u6539\u53cd\u9988\u5df2\u8bb0\u5f55");
                } else if (feedbackType === "accept" || feedbackType === "reject") {
                    addMsg("ai", data.message || "\u53cd\u9988\u5df2\u8bb0\u5f55", "\u53cd\u9988\u5df2\u8bb0\u5f55");
                }
                showToast(data.message || "\u53cd\u9988\u5df2\u8bb0\u5f55");
                loadMemorySummary();
                loadPrivacyStatus();
            } catch (e) {
                showToast("\u53cd\u9988\u63d0\u4ea4\u5931\u8d25");
            }
        }

        sendInteractionFeedback = sendInteractionFeedbackInline;

        function handlePipelineUpdate(msg) {
            const { type, data } = msg;
            if (type === "pipeline_start") {
                activePipeline = data.steps || {};
                resetProgress();
                setProgressState("bsr", "active");
                return;
            }
            if (type === "pipeline_error") {
                progressOrder.forEach((step) => setProgressState(step, "error"));
                activePipeline = null;
                return;
            }
            if (type !== "pipeline_step" || !data.step) {
                return;
            }
            activePipeline = activePipeline || {};
            activePipeline[data.step] = data.data || {};
            const currentIndex = progressOrder.indexOf(data.step);
            progressOrder.forEach((step, index) => {
                if (index < currentIndex || index === currentIndex) {
                    setProgressState(step, "done");
                } else if (index === currentIndex + 1) {
                    setProgressState(step, "active");
                } else {
                    setProgressState(step, "wait");
                }
            });
            if (data.step === "exec") {
                activePipeline = null;
            }
        }

        function handleMessage(msg) {
            const { type, data } = msg;
            switch (type) {
                case "connected":
                    updateContext(data.context || {});
                    updateDevices(data.devices || {});
                    loadDevices(false);
                    loadRules();
                    loadMemorySummary();
                    loadPrivacyStatus();
                    break;
                case "agent_response":
                    addMsg("ai", data.result, data.status === "unsupported" ? "暂不支持" : "执行完成");
                    addLog("系统", data.result);
                    loadStatus();
                    loadMemorySummary();
                    loadPrivacyStatus();
                    break;
                case "automation_update":
                    addMsg("system", `${data.rule || "自动化规则"}：${data.result || "已执行"}`, "自动触发");
                    addLog("自动化", `${data.rule || "规则"} → ${data.result || "已执行"}`);
                    loadStatus();
                    loadMemorySummary();
                    break;
                case "agent_clarification":
                    addMsg("ai", data.question, "需要澄清");
                    addLog("系统", data.question);
                    loadPrivacyStatus();
                    break;
                case "device_update":
                    updateDeviceState(data.device, data.state);
                    addLog(getDeviceName(data.device), buildDeviceStatus(data.device, data.state));
                    break;
                case "scene_update":
                    currentScene = data.scene;
                    updateDevices(data.devices || {});
                    addLog("场景", getSceneName(data.scene));
                    if (currentModal === "scene") {
                        renderModal("scene");
                    }
                    break;
                default:
                    break;
            }
        }

        function initWebSocket() {
            if (typeof io === "undefined") {
                addLog("系统", "Socket.IO 客户端未加载，已切换到 API 回复模式");
                return;
            }
            socket = io(window.location.origin);
            socket.on("connect", () => addLog("系统", "连接已建立"));
            socket.on("disconnect", () => addLog("系统", "连接已断开"));
            socket.on("message", handleMessage);
            socket.on("pipeline_update", handlePipelineUpdate);
        }

        function loadStatus() {
            fetch(`${window.location.origin}/api/status`)
                .then((r) => r.json())
                .then((data) => {
                    updateContext(data.context || {});
                    updateDevices(data.devices || {});
                })
                .catch(() => showToast("加载状态失败"));
        }

        function renderAgentMessage(data, fallbackTag = "系统响应") {
            const text = data.response || data.result || data.message || data.question || "我需要更多信息";
            let tag = fallbackTag;
            if (data.response_type === "automation_proposal") tag = "待确认任务";
            else if (data.response_type === "automation_created") tag = "任务已创建";
            else if (data.response_type === "execution_result") tag = "执行完成";
            else if (data.response_type === "chat") tag = "普通回复";
            else if (data.status === "unsupported") tag = "暂不支持";
            else if (data.status === "clarification") tag = "需要澄清";
            addMsg("ai", text, tag, {
                feedbackTarget: data.feedback_target,
                allowAccept: data.status !== "unsupported" && data.status !== "clarification",
                correctionPrompt: data.response_type === "automation_proposal"
                    ? "请输入修正后的定时任务描述"
                    : "请输入你期望的正确理解",
            });
            addLog("系统", text);
        }

        async function sendQuery(query) {
            if (socket && socket.connected) {
                socket.emit("user_input", { text: query });
                return;
            }

            const data = await apiJson("/api/query", "POST", { query });
            if (["success", "unsupported", "clarification"].includes(data.status)) {
                renderAgentMessage(data);
                if (data.status === "success") {
                    loadStatus();
                }
                return;
            }

            const text = data.message || data.question || "我需要更多信息";
            addMsg("ai", text, "系统响应");
            addLog("系统", text);
        }

        async function switchScene(scene) {
            try {
                const data = await apiJson(`/api/scenes/${encodeURIComponent(scene)}/switch`, "POST", {});
                if (data.status !== "success") {
                    showToast(data.error || "场景切换失败");
                    return;
                }
                currentScene = data.scene || scene;
                updateDevices(data.devices || {});
                addLog("场景", getSceneName(currentScene));
                addMsg("system", data.result || `已切换到${getSceneName(currentScene)}`, "场景切换");
                loadStatus();
                loadMemorySummary();
                if (currentModal === "scene") {
                    renderModal("scene");
                }
            } catch (error) {
                showToast("场景切换失败");
            }
        }

        function handleMessage(msg) {
            const { type, data } = msg;
            switch (type) {
                case "connected":
                    updateContext(data.context || {});
                    updateDevices(data.devices || {});
                    loadDevices(false);
                    loadRules();
                    loadMemorySummary();
                    loadPrivacyStatus();
                    break;
                case "agent_response":
                    renderAgentMessage(data, "执行完成");
                    loadStatus();
                    loadMemorySummary();
                    loadPrivacyStatus();
                    break;
                case "automation_update":
                    addMsg("system", `${data.rule || "自动化规则"}：${data.result || "已执行"}`, "自动触发");
                    addLog("自动化", `${data.rule || "规则"} -> ${data.result || "已执行"}`);
                    loadStatus();
                    loadMemorySummary();
                    break;
                case "agent_clarification":
                    renderAgentMessage({
                        status: "clarification",
                        question: data.question,
                        feedback_target: data.feedback_target,
                    }, "需要澄清");
                    loadPrivacyStatus();
                    break;
                case "dqn_recommendation":
                    addMsg("ai", `${data.reason}（置信度 ${(Number(data.confidence || 0) * 100).toFixed(0)}%）`, "主动推荐", {
                        feedbackTarget: { message_id: data.message_id, target_type: "recommendation" },
                        correctionPrompt: "请输入更合适的场景建议",
                    });
                    addLog("推荐", data.reason || "收到新的场景推荐");
                    break;
                case "device_update":
                    updateDeviceState(data.device, data.state);
                    addLog(getDeviceName(data.device), buildDeviceStatus(data.device, data.state));
                    break;
                case "scene_update":
                    currentScene = data.scene;
                    updateDevices(data.devices || {});
                    addLog("场景", getSceneName(data.scene));
                    if (currentModal === "scene") {
                        renderModal("scene");
                    }
                    break;
                default:
                    break;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            tick();
            setInterval(tick, 1000);
            document.getElementById("boot-time").textContent = getTime();
            resetProgress();
            autoResize();
            initVoiceRecognition();
            initWebSocket();
            loadDevices(false);
            loadStatus();
            loadRules();
            loadSchedulerStatus();
            loadMemorySummary();
            loadPrivacyStatus();
        });
    </script>
</body>
</html>
